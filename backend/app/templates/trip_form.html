{% extends "base_user.html" %}
{% block title %}Nuevo viaje{% endblock %}
{% block content %}
<div class="container">
  <a class="back-link" href="/passport/{{ user.id }}">&larr; Volver a mi perfil</a>
  <p class="eyebrow">{{ user.name }}</p>
  <h1 class="page-title">Nuevo viaje</h1>

  {% if error %}
  <p class="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="/passport/{{ user.id }}/trips">
    <div class="field">
      <label for="destination">Destino</label>
      <input type="text" id="destination" name="destination" required>
    </div>
    <div class="field">
      <label for="start_date">Fecha de inicio</label>
      <input type="date" id="start_date" name="start_date" required>
    </div>
    <button type="submit" class="btn btn-flare">Crear viaje</button>
  </form>
</div>
{% endblock %}
