{% extends "base.html" %}
{% block title %}Nuevo viaje{% endblock %}
{% block header %}Ski App{% endblock %}
{% block content %}
<p><a href="/passport/{{ user.id }}">&larr; Volver a mi perfil</a></p>

<h2>Nuevo viaje</h2>
<p>Usuario: {{ user.name }}</p>

{% if error %}
<p class="summary-box" style="border-left-color:#a33; background:#fee;">{{ error }}</p>
{% endif %}

<form method="post" action="/passport/{{ user.id }}/trips">
  <label>Destino:<br>
    <input type="text" name="destination" required>
  </label>
  <br><br>
  <label>Fecha de inicio:<br>
    <input type="date" name="start_date" required>
  </label>
  <br><br>
  <button type="submit">Crear viaje</button>
</form>
{% endblock %}
